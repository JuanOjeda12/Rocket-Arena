services:
  - type: web
    name: rocket-arena-private
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DISABLE_DISCOVERY
        value: '1'
      - key: MAX_ROOMS
        value: '1'
